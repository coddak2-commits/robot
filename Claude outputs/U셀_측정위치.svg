<svg xmlns="http://www.w3.org/2000/svg" width="980" height="600" viewBox="0 0 980 600" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="980" height="600" fill="#ffffff"/>
  <text x="30" y="40" font-size="22" font-weight="bold" fill="#111">수직 끝(P1/P7)에서 정면으로 뺄 거리 정하기 - 재야 할 곳</text>
  <text x="30" y="68" font-size="15" fill="#444">옆에서 본 그림 (왼쪽 = 뒷판, 오른쪽 = U셀 앞쪽 열린 방향 = 로봇이 빠져나갈 +X 방향)</text>

  <!-- floor -->
  <rect x="80" y="520" width="620" height="18" fill="#9aa3ad"/>
  <text x="600" y="560" font-size="14" fill="#555">바닥판</text>

  <!-- back plate -->
  <rect x="80" y="110" width="22" height="410" fill="#7c8691"/>
  <text x="40" y="320" font-size="15" fill="#333" transform="rotate(-90 40 320)">뒷판</text>

  <!-- stiffener (vertical member), side view: extends in +X -->
  <rect x="102" y="200" width="210" height="320" fill="#c9cfd6" stroke="#7c8691" stroke-width="2"/>
  <text x="150" y="380" font-size="15" fill="#333">수직재(세운 판)</text>

  <!-- top flat bar on top of stiffener, sticks out forward -->
  <rect x="102" y="176" width="300" height="24" fill="#8a6d4f"/>
  <text x="230" y="168" font-size="15" fill="#6b4f33">수직재 위 가로 판</text>

  <!-- weld seam line along back plate corner -->
  <line x1="104" y1="510" x2="104" y2="214" stroke="#d9480f" stroke-width="5"/>
  <text x="112" y="470" font-size="14" fill="#d9480f">수직 용접선</text>

  <!-- P1 point -->
  <circle cx="106" cy="214" r="7" fill="#d9480f"/>
  <text x="118" y="232" font-size="16" font-weight="bold" fill="#d9480f">P1 / P7 (수직 끝)</text>

  <!-- torch -->
  <g transform="rotate(-40 106 214)">
    <rect x="96" y="214" width="20" height="90" fill="#555" opacity="0.85"/>
    <rect x="92" y="300" width="28" height="60" fill="#333" opacity="0.85"/>
  </g>
  <text x="200" y="290" font-size="14" fill="#333">토치</text>

  <!-- retract arrow +X -->
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1971c2"/>
    </marker>
    <marker id="dm" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,5 L10,0 L10,10 z" fill="#2b8a3e"/>
    </marker>
    <marker id="dm2" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M10,5 L0,0 L0,10 z" fill="#2b8a3e"/>
    </marker>
  </defs>
  <line x1="120" y1="214" x2="560" y2="214" stroke="#1971c2" stroke-width="4" stroke-dasharray="10 6" marker-end="url(#ah)"/>
  <text x="430" y="245" font-size="15" fill="#1971c2">정면(+X)으로 똑바로 빼기</text>
  <line x1="580" y1="214" x2="580" y2="110" stroke="#1971c2" stroke-width="3" stroke-dasharray="6 6" marker-end="url(#ah)"/>
  <text x="595" y="140" font-size="14" fill="#1971c2">판 밖으로 나온 뒤 홈으로</text>

  <!-- Dimension A: back plate face -> front edge of top bar -->
  <line x1="102" y1="130" x2="102" y2="172" stroke="#2b8a3e" stroke-width="1.5"/>
  <line x1="402" y1="130" x2="402" y2="172" stroke="#2b8a3e" stroke-width="1.5"/>
  <line x1="102" y1="140" x2="402" y2="140" stroke="#2b8a3e" stroke-width="2.5" marker-start="url(#dm)" marker-end="url(#dm2)"/>
  <rect x="210" y="100" width="90" height="30" rx="6" fill="#2b8a3e"/>
  <text x="255" y="121" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">A</text>

  <!-- Dimension B: P1 -> underside of top bar -->
  <line x1="340" y1="200" x2="340" y2="214" stroke="#e67700" stroke-width="2.5"/>
  <line x1="330" y1="200" x2="350" y2="200" stroke="#e67700" stroke-width="2"/>
  <line x1="330" y1="214" x2="350" y2="214" stroke="#e67700" stroke-width="2"/>
  <rect x="356" y="196" width="34" height="24" rx="5" fill="#e67700"/>
  <text x="373" y="214" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">B</text>

  <!-- legend box -->
  <rect x="720" y="100" width="240" height="250" rx="10" fill="#f1f3f5" stroke="#ced4da"/>
  <rect x="736" y="118" width="34" height="26" rx="5" fill="#2b8a3e"/>
  <text x="753" y="137" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">A</text>
  <text x="780" y="137" font-size="15" font-weight="bold" fill="#111">꼭 필요</text>
  <text x="736" y="165" font-size="14" fill="#333">뒷판 표면에서</text>
  <text x="736" y="185" font-size="14" fill="#333">수직재 위 가로 판(또는 수직재)</text>
  <text x="736" y="205" font-size="14" fill="#333">맨 앞 끝까지의 거리</text>
  <text x="736" y="225" font-size="13" fill="#555">→ 이보다 여유 있게 빼면 머리 위가 빔</text>

  <rect x="736" y="252" width="34" height="26" rx="5" fill="#e67700"/>
  <text x="753" y="271" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">B</text>
  <text x="780" y="271" font-size="15" font-weight="bold" fill="#111">참고</text>
  <text x="736" y="299" font-size="14" fill="#333">용접선 맨 위 끝(P1/P7)에서</text>
  <text x="736" y="319" font-size="14" fill="#333">가로 판 아랫면까지 높이</text>

  <text x="30" y="590" font-size="14" fill="#555">좌측(P1)·우측(P7) 수직재가 다르면 양쪽 A 를 각각 재 주세요. 실제 현장 U셀 기준입니다.</text>
</svg>
