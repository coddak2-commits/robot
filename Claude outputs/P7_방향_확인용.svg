<svg xmlns="http://www.w3.org/2000/svg" width="800" height="700" viewBox="0 0 800 700" font-family="sans-serif">
  <rect width="800" height="700" fill="white"/>

  <text x="400" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">P7 지점 - 위에서 내려다본 방향 (Top View)</text>
  <text x="400" y="60" text-anchor="middle" font-size="14" fill="#555">현재 로봇 팔이 오른쪽(+X)에서 뻗어와 P7에 닿는 상태</text>

  <!-- Robot body/arm on the +X side, reaching toward center -->
  <rect x="630" y="345" width="90" height="70" rx="8" fill="#616161"/>
  <text x="675" y="330" text-anchor="middle" font-size="14" fill="#333">로봇 몸체</text>
  <line x1="630" y1="380" x2="420" y2="380" stroke="#616161" stroke-width="14" stroke-linecap="round"/>
  <text x="520" y="330" text-anchor="middle" font-size="13" fill="#616161">로봇 팔 (현재 접근 경로)</text>

  <!-- center point (torch tip / P7) -->
  <circle cx="400" cy="380" r="10" fill="#333"/>
  <text x="400" y="415" text-anchor="middle" font-size="14" fill="#333">P7 (터치 포인트)</text>

  <!-- current approach direction: +X, pointing right, RED (problem) -->
  <line x1="410" y1="380" x2="605" y2="380" stroke="#d32f2f" stroke-width="6" marker-end="url(#arrowRed)"/>
  <text x="500" y="405" text-anchor="middle" font-size="14" font-weight="bold" fill="#d32f2f">① 현재 접근/후퇴 방향 (+X)</text>
  <text x="500" y="440" text-anchor="middle" font-size="13" fill="#d32f2f">→ 여기서 충돌/에러 발생</text>

  <!-- opposite: -X, left -->
  <line x1="390" y1="380" x2="160" y2="380" stroke="#1976d2" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <text x="270" y="355" text-anchor="middle" font-size="15" fill="#1976d2">② 반대 방향 (-X)</text>
  <text x="270" y="405" text-anchor="middle" font-size="13" fill="#1976d2">여유 있음?</text>

  <!-- up: +Y -->
  <line x1="400" y1="370" x2="400" y2="140" stroke="#388e3c" stroke-width="4" marker-end="url(#arrowGreen)"/>
  <text x="400" y="120" text-anchor="middle" font-size="15" fill="#388e3c">③ 위쪽 방향 (+Y)</text>
  <text x="400" y="100" text-anchor="middle" font-size="13" fill="#388e3c">여유 있음?</text>

  <!-- down: -Y -->
  <line x1="400" y1="390" x2="400" y2="600" stroke="#f57c00" stroke-width="4" marker-end="url(#arrowOrange)"/>
  <text x="400" y="625" text-anchor="middle" font-size="15" fill="#f57c00">④ 아래쪽 방향 (-Y)</text>
  <text x="400" y="645" text-anchor="middle" font-size="13" fill="#f57c00">← 지금 이 방향으로 변경함</text>

  <defs>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#d32f2f"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1976d2"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#388e3c"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#f57c00"/>
    </marker>
  </defs>

  <text x="400" y="670" text-anchor="middle" font-size="14" fill="#000">로봇 몸체 위치를 기준으로, 현장에서 실제로 이 배치가 맞는지 확인해주세요.</text>
  <text x="400" y="690" text-anchor="middle" font-size="12" fill="#777">※ 로봇 팔 각도/자세는 단순화했습니다. 실제 팔 방향이 다르면 알려주세요.</text>
</svg>
